<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>EduMinat · Parent</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><i class="fas fa-rocket"></i> <span>EduMinat</span></div>
      <div class="user-card">
        <div class="avatar" id="avatar">P</div>
        <div class="info">
          <strong id="userName">Loading...</strong>
          <span data-i18n="role.parent"></span>
        </div>
      </div>
      <nav class="nav">
        <div class="nav-item active"><i class="fas fa-chart-line"></i> <span data-i18n="nav.child"></span></div>
        <div class="nav-item" onclick="openAiSettings()"><i class="fas fa-robot"></i>
          <span data-i18n="reflect.ai_settings"></span>
          <span id="aiKeyStatus" style="
                    margin-left:auto;
                    font-size:0.7rem;
                    font-weight:700;
                    padding:2px 6px;
                    border-radius:10px;
                    background:#fff2e0;
                    color:#b45f06;
                  ">!</span>
        </div>
        <div class="nav-item" onclick="DB.resetDemo()"><i class="fas fa-rotate-left"></i> <span data-i18n="nav.reset"></span></div>
        <div class="nav-item logout" onclick="DB.logout()"><i class="fas fa-sign-out-alt"></i> <span data-i18n="nav.logout"></span></div>
      </nav>
    </aside>
    <main class="main" id="main"></main>
  </div>

    <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

  <div id="tourBanner" class="tour-banner hidden">
    <div class="tour-content">
      <div class="tour-icon"><i class="fas fa-graduation-cap"></i></div>
      <div class="tour-text">
        <strong id="tourTitle"></strong>
        <p id="tourBody"></p>
        <ol id="tourSteps"></ol>
      </div>
      <button class="tour-dismiss" onclick="dismissTour()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <button class="btn btn-primary btn-sm" onclick="dismissTour()" id="tourDismissBtn"></button>
  </div>

  <script src="scripts/i18n.js"></script>
  <script src="scripts/db.js"></script>
  <script src="scripts/ai.js"></script>
  <script src="scripts/ai-settings.js"></script>
  <script src="scripts/tour.js"></script>
  <script>
    let user = null;

    document.addEventListener('languagechange', () => {
      I18N.injectLanguageSwitcher();
      I18N.applyI18n();
      render();
    });

    async function init() {
      await DB.openDB();
      await DB.seedDemoData();

      I18N.injectLanguageSwitcher();
      I18N.applyI18n();

      const session = await DB.currentUser();
      user = session ? await DB.Users.get(session.email) : null;
      if (!user || user.role !== 'parent') {
        window.location.href = 'login.html';
        return;
      }
      document.getElementById('userName').innerText = user.name;
      document.getElementById('avatar').innerText = user.name.charAt(0).toUpperCase();
      render();
    }

    async function render() {

      // Support both old (childEmail) and new (childEmails[]) formats
      let childEmails = user.childEmails;
      if (!childEmails && user.childEmail) childEmails = [user.childEmail];
      if (!childEmails || childEmails.length === 0) {
        document.getElementById('main').innerHTML =
          `<div class="header"><h1>${I18N.t('nav.child')}</h1></div>
         <div class="card"><div class="empty"><i class="fas fa-user-slash"></i>${I18N.t('parent.no_child')}</div></div>`;
        return;
      }

      const children = [];
      for (const email of childEmails) {
        const child = await DB.Users.get(email);
        if (!child) continue;
        const pajskData = await DB.calculatePajsk(child.email);
        const regs = await DB.Registrations.byStudent(child.email);
        const reflections = await DB.Reflections.byStudent(child.email);
        children.push({
          child,
          pajskData,
          regs,
          reflections
        });
      }

      const comps = await DB.Competitions.all();

      const cardsHTML = children.map(({
        child,
        pajskData,
        regs,
        reflections
      }) => `
        <div class="card">
          <div class="flex-between" style="margin-bottom:1rem;">
            <div>
              <h3 style="margin-bottom:0.2rem;">${child.name}</h3>
              <span class="text-muted">${child.class || '—'}</span>
            </div>
            <div style="text-align:right;">
              <div class="text-muted" style="font-size:0.8rem;">${I18N.t('parent.pajsk')}</div>
              <div style="font-size:1.8rem;font-weight:700;color:var(--primary);">
                ${pajskData.total.toFixed(1)}
              </div>
            </div>
          </div>

          ${regs.length === 0
            ? `<div class="empty"><i class="fas fa-inbox"></i>${I18N.t('parent.no_activity')}</div>`
            : `<table>
                <tr>
                  <th>${I18N.t('th.competition')}</th>
                  <th>${I18N.t('th.result')}</th>
                  <th>${I18N.t('th.marks')}</th>
                </tr>
                ${regs.map(r => {
                  const c = comps.find(c => c.id === r.competitionId);
                  return `<tr>
                    <td>${c?.name || '—'}</td>
                    <td>${r.result ? DB.resultLabel(r.result) : DB.statusLabel(r.status)}</td>
                    <td>${r.totalPajsk || 0}</td>
                  </tr>`;
                }).join('')}
              </table>`}

          ${reflections && reflections.length > 0 ? `
            <h4 style="margin:1.2rem 0 0.6rem;font-size:1rem;">${I18N.t('reflect.report_title')} (${reflections.length})</h4>
            ${reflections.map((r, idx) => `
              <div class="card" style="background:var(--primary-light);border:none;padding:0.9rem 1.1rem;margin-bottom:0.6rem;">
                <div class="flex-between" style="margin-bottom:0.4rem;">
                  <strong style="color:var(--primary);font-size:0.9rem;">${escapeHtml(r.competitionName)}</strong>
                  <span class="text-muted" style="font-size:0.72rem;">
                    ${new Date(r.createdAt).toLocaleDateString(I18N.getLanguage() === 'en' ? 'en-MY' : 'ms-MY', {
                      day: 'numeric', month: 'short', year: 'numeric'
                    })}
                  </span>
                </div>
                <div style="margin:0 0 0.6rem;font-size:0.85rem;line-height:1.55;color:var(--text-muted);">
                  ${AI.markdownToHtml(r.insights.substring(0, 350))}${r.insights.length > 350 ? '…' : ''}
                </div>
                <button class="btn btn-outline btn-sm" data-view-reflection="${child.email}|${r.competitionId}">
                  <i class="fas fa-eye"></i> ${I18N.t('reflect.view')}
                </button>
              </div>
            `).join('')}
          ` : ''}
          <!-- AI Summary section -->
          <div style="margin-top:1.2rem;border-top:1px solid var(--border);padding-top:1rem;" id="aiSummary-${child.email}">
            <div class="flex-between" style="margin-bottom:0.6rem;">
              <strong style="font-size:0.95rem;">
                <i class="fas fa-robot" style="color:var(--primary);"></i>
                ${I18N.t('parent.ai_summary_title')}
              </strong>
              <button
                class="btn btn-outline btn-sm"
                onclick="generateParentSummary('${child.email}')"
                id="aiSummaryBtn-${child.email}"
              >
                <i class="fas fa-magic"></i> ${I18N.t('parent.ai_summary_btn')}
              </button>
            </div>
            <div id="aiSummaryBody-${child.email}">
              <p class="text-muted" style="font-size:0.85rem;margin:0;">
                ${I18N.t('parent.ai_summary_subtitle') || 'Click the button to generate a personalized progress summary.'}
              </p>
            </div>
          </div>

        </div>
      `).join('');

      // Summary at the top
      const totalPajsk = children.reduce((sum, c) => sum + c.pajskData.total, 0);
      const totalComps = children.reduce((sum, c) => sum + c.regs.length, 0);

      document.getElementById('main').innerHTML = `
        <div class="header">
          <h1>${I18N.t('nav.child')} <span>· ${user.name}</span></h1>
        </div>

        <div class="grid-3">
          <div class="stat">
            <div class="label">${I18N.t('parent.children')}</div>
            <div class="value">${children.length}</div>
          </div>
          <div class="stat">
            <div class="label">${I18N.t('parent.total_pajsk')}</div>
            <div class="value">${totalPajsk.toFixed(1)}</div>
          </div>
          <div class="stat">
            <div class="label">${I18N.t('parent.total_activities')}</div>
            <div class="value">${totalComps}</div>
          </div>
        </div>

        ${cardsHTML}
      `;

      attachParentHandlers();


      // After the main content is inserted into #main:
      if (typeof renderTour === 'function') renderTour();
    }

    // ============================================================
    // PARENT PAGE EVENT HANDLERS
    // ============================================================
    function attachParentHandlers() {
      document.querySelectorAll('[data-view-reflection]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const [childEmail, compIdStr] = btn.dataset.viewReflection.split('|');
          const compId = parseInt(compIdStr, 10);

          const reflection = await DB.Reflections.find(childEmail, compId);
          if (reflection) {
            showParentReflectionDetail(reflection);
          } else {
            showToast('Reflection not found', 'exclamation-circle');
          }
        });
      });
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function showToast(msg, icon = 'check-circle') {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').innerText = msg;
    t.querySelector('i').className = `fas fa-${icon}`;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    // ============================================================
    //  FULL REFLECTION MODAL (parent view)
    // ============================================================
    function showParentReflectionDetail(reflection) {
      document.getElementById('parentReflectionModal')?.remove();

      const overlay = document.createElement('div');
      overlay.className = 'modal-backdrop show';
      overlay.id = 'parentReflectionModal';
      overlay.innerHTML = `
        <div class="modal" style="max-width:680px;">
          <div class="modal-header">
            <div>
              <h3>${I18N.t('reflect.report_title')}</h3>
              <p class="sub">${escapeHtml(reflection.competitionName)}</p>
            </div>
            <button class="modal-close" onclick="document.getElementById('parentReflectionModal').remove()">✕</button>
          </div>

          <div class="modal-body">
            <h4 style="margin-bottom:0.6rem;">${I18N.t('reflect.insights')}</h4>
            <div style="
              background:var(--primary-light);
              padding:1.2rem 1.4rem;
              border-radius:12px;
              font-size:0.92rem;
              line-height:1.7;
              white-space:pre-wrap;
              margin-bottom:1.5rem;
            ">${AI.markdownToHtml(reflection.insights)}</div>

            <h4 style="margin-bottom:0.6rem;">${I18N.t('reflect.answers')}</h4>
            <table class="modal-table">
              ${reflection.questions.map(q => `
                <tr>
                  <td style="width:45%;vertical-align:top;padding:0.6rem 0.4rem;">
                    <strong style="font-size:0.88rem;">${escapeHtml(q.text)}</strong>
                  </td>
                  <td style="padding:0.6rem 0.4rem;color:var(--text-muted);font-size:0.9rem;">
                    ${reflection.answers[q.id]
                      ? escapeHtml(reflection.answers[q.id])
                      : `<em>${I18N.t('reflect.not_answered')}</em>`}
                  </td>
                </tr>
              `).join('')}
            </table>
          </div>

          <div class="modal-footer">
            <button class="btn btn-outline" onclick="document.getElementById('parentReflectionModal').remove()">
              ${I18N.t('common.close')}
            </button>
          </div>
        </div>
      `;

      // Close on backdrop click
      overlay.addEventListener('click', (e) => {
        if (e.target.id === 'parentReflectionModal') overlay.remove();
      });

      // Close on Escape
      const escHandler = (e) => {
        if (e.key === 'Escape') {
          overlay.remove();
          document.removeEventListener('keydown', escHandler);
        }
      };
      document.addEventListener('keydown', escHandler);

      document.body.appendChild(overlay);
    }

    // ============================================================
    //  AI PARENT SUMMARY
    // ============================================================
    async function generateParentSummary(childEmail) {
      const btn = document.getElementById(`aiSummaryBtn-${childEmail}`);
      const body = document.getElementById(`aiSummaryBody-${childEmail}`);
      if (!btn || !body) return;

      btn.disabled = true;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${I18N.t('parent.ai_summary_btn')}`;

      body.innerHTML = `
        <div style="padding:0.8rem 0;text-align:center;">
          <i class="fas fa-spinner fa-spin" style="color:var(--primary);font-size:1.4rem;"></i>
          <p class="text-muted" style="font-size:0.85rem;margin-top:0.4rem;">
            ${I18N.t('parent.ai_summary_loading')}
          </p>
        </div>
      `;

      try {
        const lang = I18N.getLanguage();
        const result = await AI.aiParentSummary(childEmail, lang);

        if (!result || !result.summary) {
          body.innerHTML = `<p class="text-muted">${I18N.t('parent.ai_summary_failed')}</p>`;
          return;
        }

        // Render the summary with markdown → HTML
        const markdownHtml = AI.markdownToHtml(result.summary);

        body.innerHTML = `
          <div style="
            background:linear-gradient(135deg,#f5f3ff 0%,#fff 100%);
            border:1px solid #e0daff;
            border-radius:12px;
            padding:1rem 1.2rem;
            font-size:0.9rem;
            line-height:1.7;
          ">
            ${markdownHtml}
          </div>
          <div style="margin-top:0.6rem;display:flex;justify-content:space-between;align-items:center;gap:0.6rem;">
            <span class="text-muted" style="font-size:0.75rem;">
              ${result.aiGenerated
                ? `<i class="fas fa-robot"></i> ${I18N.t('parent.ai_summary_by_ai')}`
                : `<i class="fas fa-info-circle"></i> ${I18N.t('parent.ai_summary_demo')}`}
            </span>
            <button
              class="btn btn-outline btn-sm"
              onclick="generateParentSummary('${childEmail}')"
            >
              <i class="fas fa-rotate"></i> ${I18N.t('parent.ai_summary_regenerate')}
            </button>
          </div>
        `;
      } catch (err) {
        console.error(err);
        body.innerHTML = `<p class="text-muted">${I18N.t('parent.ai_summary_failed')}</p>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fas fa-magic"></i> ${I18N.t('parent.ai_summary_btn')}`;
      }
    }

    init();
  </script>
</body>

</html>
