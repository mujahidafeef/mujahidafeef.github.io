<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>EduMinat · KPM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><i class="fas fa-rocket"></i> <span>EduMinat</span></div>
      <div class="user-card">
        <div class="avatar" id="avatar">K</div>
        <div class="info">
          <strong id="userName">Loading...</strong>
          <span data-i18n="role.kpm"></span>
        </div>
      </div>
      <nav class="nav">
        <div class="nav-item active" data-tab="queue"><i class="fas fa-check-double"></i> <span data-i18n="nav.queue"></span></div>
        <div class="nav-item" data-tab="all"><i class="fas fa-list"></i> <span data-i18n="nav.all_comps"></span></div>
        <div class="nav-item" data-tab="ask"><i class="fas fa-comments"></i> <span data-i18n="kpm.ask_title"></span></div>
        <div class="nav-item" data-tab="analytics"><i class="fas fa-chart-bar"></i> <span data-i18n="nav.analytics"></span></div>
        <div class="nav-item" data-tab="reports"><i class="fas fa-file-signature"></i> <span data-i18n="nav.reports"></span></div>
        <div class="nav-item" onclick="openKpmSettings()"><i class="fas fa-id-card"></i> <span data-i18n="nav.kpm_settings"></span></div>
        <div class="nav-item" onclick="openAiSettings()"><i class="fas fa-robot"></i>
          <span data-i18n="reflect.ai_settings"></span>
          <span id="aiKeyStatus" style="
                    margin-left:auto;
                    font-size:0.7rem;
                    font-weight:700;
                    padding:2px 6px;
                    border-radius:10px;
                    background:#fff2e0;
                    color:#b45f06;
                  ">!</span>
        </div>
        <div class="nav-item" onclick="DB.resetDemo()"><i class="fas fa-rotate-left"></i> <span data-i18n="nav.reset"></span></div>
        <div class="nav-item logout" onclick="DB.logout()"><i class="fas fa-sign-out-alt"></i> <span data-i18n="nav.logout"></span></div>
      </nav>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

  <div id="tourBanner" class="tour-banner hidden">
    <div class="tour-content">
      <div class="tour-icon"><i class="fas fa-graduation-cap"></i></div>
      <div class="tour-text">
        <strong id="tourTitle"></strong>
        <p id="tourBody"></p>
        <ol id="tourSteps"></ol>
      </div>
      <button class="tour-dismiss" onclick="dismissTour()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <button class="btn btn-primary btn-sm" onclick="dismissTour()" id="tourDismissBtn"></button>
  </div>

  <script src="scripts/html2canvas.min.js"></script>
  <script src="scripts/jspdf.umd.min.js"></script>
  <script src="scripts/chart.umd.min.js"></script>
  <script src="scripts/i18n.js"></script>
  <script src="scripts/tour.js"></script>
  <script src="scripts/db.js"></script>
  <script src="scripts/table-tools.js"></script>
  <script src="scripts/ai.js"></script>
  <script src="scripts/ai-settings.js"></script>
  <script>
    let user = null;
    let currentTab = 'queue';

    document.addEventListener('languagechange', () => {
      I18N.injectLanguageSwitcher();
      I18N.applyI18n();
      render();
    });

    async function init() {
      await DB.openDB();
      await DB.seedDemoData();

      I18N.injectLanguageSwitcher();
      I18N.applyI18n();

      const session = await DB.currentUser();
      user = session ? await DB.Users.get(session.email) : null;
      if (!user || user.role !== 'kpm') {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('userName').innerText = user.name;
      document.getElementById('avatar').innerText = user.name.charAt(0).toUpperCase();

      document.querySelectorAll('.nav-item[data-tab]').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
          el.classList.add('active');
          currentTab = el.dataset.tab;
          render();
        });
      });

      render();
    }

    async function render() {
      const main = document.getElementById('main');
      main.innerHTML = `<div class="empty"><i class="fas fa-spinner fa-spin"></i>${I18N.t('common.loading')}</div>`;

      try {
        if (currentTab === 'queue') main.innerHTML = await renderQueue();
        else if (currentTab === 'all') main.innerHTML = await renderAll();
        else if (currentTab === 'ask') main.innerHTML = await renderAsk();
        else if (currentTab === 'analytics') main.innerHTML = await renderAnalytics();
        else if (currentTab === 'reports') main.innerHTML = await renderReports();
        else main.innerHTML = `<div class="card"><div class="empty">Unknown tab: ${currentTab}</div></div>`;

        attachHandlers();
      } catch (err) {
        console.error(err);
        main.innerHTML = `<div class="card"><div class="empty">
          <i class="fas fa-exclamation-triangle"></i>${I18N.t('common.error')}: ${err.message}
        </div></div>`;
      }

      if (typeof renderTour === 'function') renderTour();
    }

    async function renderQueue() {
      const pending = await DB.Competitions.byStatus('pending');
      const approved = await DB.Competitions.byStatus('approved');

      return `
        <div class="header"><h1>${I18N.t('kpm.queue_title')}</h1></div>

        <div class="grid-3">
          <div class="stat"><div class="label">${I18N.t('kpm.waiting')}</div><div class="value">${pending.length}</div></div>
          <div class="stat"><div class="label">${I18N.t('kpm.approved')}</div><div class="value">${approved.length}</div></div>
          <div class="stat"><div class="label">${I18N.t('kpm.total')}</div><div class="value">${pending.length + approved.length}</div></div>
        </div>

        <div class="card">
          <h3>${I18N.t('kpm.queue_title')}</h3>

          ${pending.length === 0 ? emptyState(I18N.t('kpm.no_pending')) : `
            <div class="tt-toolbar">
              <div class="tt-search">
                <i class="fas fa-search"></i>
                <input type="text" id="kpmQueueSearch" placeholder="${I18N.t('common.search_comps')}">
              </div>
              <select id="kpmQueueLevel">
                <option value="">${I18N.t('common.all_levels')}</option>
                ${['antarabangsa','kebangsaan','negeri','bahagian','zon_daerah']
                  .map(l => `<option value="${DB.levelLabel(l)}">${DB.levelLabel(l)}</option>`).join('')}
              </select>
            </div>

            <table id="kpmQueueTable">
              <tr>
                <th>${I18N.t('th.competition')}</th>
                <th>${I18N.t('th.organizer')}</th>
                <th>${I18N.t('th.level')}</th>
                <th>${I18N.t('th.marks')}</th>
                <th>${I18N.t('th.link')}</th>
                <th></th>
              </tr>
              ${pending.map(c => `
                <tr>
                  <td><strong>${c.name}</strong><br>
                    <span class="text-muted" style="font-size:0.8rem;">${c.description || ''}</span>
                  </td>
                  <td>${c.organizerName}</td>
                  <td>${DB.levelLabel(c.level)}</td>
                  <td><span class="badge badge-info">${c.participationScore} – ${c.participationScore + (c.maxAchievementScore||0)}</span></td>
                  <td>
                    ${c.url
                      ? `<a href="${escapeHtml(c.url)}" target="_blank" rel="noopener noreferrer" class="btn btn-outline btn-sm">
                           <i class="fas fa-external-link-alt"></i>
                         </a>`
                      : `<span class="text-muted">—</span>`}
                  </td>
                  <td class="flex">
                    <button class="btn btn-success btn-sm" data-approve="${c.id}">${I18N.t('common.approve')}</button>
                    <button class="btn btn-danger btn-sm" data-reject="${c.id}">${I18N.t('common.reject')}</button>
                  </td>
                </tr>
              `).join('')}
            </table>
          `}
        </div>
      `;
    }

    async function renderAll() {
      const all = await DB.Competitions.all();
      return `
        <div class="header"><h1>${I18N.t('nav.all_comps')}</h1></div>
        <div class="card">
          ${all.length === 0 ? emptyState(I18N.t('kpm.no_comps')) : `
            <div class="tt-toolbar">
              <div class="tt-search">
                <i class="fas fa-search"></i>
                <input type="text" id="allCompsSearch" placeholder="${I18N.t('common.search_comps')}">
              </div>
              <select id="allCompsLevel">
                <option value="">${I18N.t('common.all_levels')}</option>
                ${['antarabangsa','kebangsaan','negeri','bahagian','zon_daerah']
                  .map(l => `<option value="${DB.levelLabel(l)}">${DB.levelLabel(l)}</option>`).join('')}
              </select>
              <select id="allCompsStatus">
                <option value="">${I18N.t('common.all_statuses')}</option>
                <option value="${I18N.t('status.approved')}">${I18N.t('status.approved')}</option>
                <option value="${I18N.t('status.pending')}">${I18N.t('status.pending')}</option>
                <option value="${I18N.t('status.rejected')}">${I18N.t('status.rejected')}</option>
                <option value="${I18N.t('status.completed')}">${I18N.t('status.completed')}</option>
              </select>
            </div>

            <table id="allCompsTable">
              <tr>
                <th>${I18N.t('th.name')}</th>
                <th>${I18N.t('th.organizer')}</th>
                <th>${I18N.t('th.level')}</th>
                <th>${I18N.t('th.link')}</th>
                <th>${I18N.t('th.status')}</th>
              </tr>
              ${all.map(c => `
                <tr>
                  <td>${c.name}</td>
                  <td>${c.organizerName}</td>
                  <td>${DB.levelLabel(c.level)}</td>
                  <td>
                    ${c.url
                      ? `<a href="${escapeHtml(c.url)}" target="_blank" rel="noopener noreferrer" class="btn btn-outline btn-sm">
                           <i class="fas fa-external-link-alt"></i>
                         </a>`
                      : `<span class="text-muted">—</span>`}
                  </td>
                  <td><span class="badge ${
                    c.status === 'approved'  ? 'badge-success'
                    : c.status === 'pending'   ? 'badge-warning'
                    : c.status === 'rejected'  ? 'badge-danger'
                    : c.status === 'completed' ? 'badge-info'
                    : 'badge-secondary'
                  }">${DB.statusLabel(c.status)}</span></td>
                </tr>
              `).join('')}
            </table>
          `}
        </div>
      `;
    }

    async function renderAnalytics() {
      const comps = await DB.Competitions.all();
      const regs = await DB.Registrations.all();
      const marks = await DB.Marks.all();
      const students = await DB.Users.byRole('student');

      const uniqueClasses = new Set(students.map(s => s.class).filter(Boolean));
      const schoolsCount = uniqueClasses.size;

      const activeStudents = new Set(
        regs.filter(r => r.status === 'registered' || r.status === 'ongoing')
        .map(r => r.studentEmail)
      ).size;

      const totalMarks = marks.reduce((sum, m) => sum + (m.marks || 0), 0);

      let totalPajsk = 0;
      for (const s of students) {
        const p = await DB.calculatePajsk(s.email);
        totalPajsk += p.total;
      }
      const avgPajsk = students.length ? (totalPajsk / students.length) : 0;

      return `
        <div class="header"><h1>${I18N.t('kpm.analytics_title')}</h1></div>

        <div class="grid-4">
          <div class="stat">
            <div class="label">${I18N.t('kpm.kpi_schools')}</div>
            <div class="value">${schoolsCount}</div>
            <div class="sub">${students.length} total students</div>
          </div>
          <div class="stat">
            <div class="label">${I18N.t('kpm.kpi_students')}</div>
            <div class="value">${activeStudents}</div>
            <div class="sub">${comps.filter(c => c.status === 'approved').length} open competitions</div>
          </div>
          <div class="stat">
            <div class="label">${I18N.t('kpm.kpi_avg_pajsk')}</div>
            <div class="value">${avgPajsk.toFixed(1)}</div>
            <div class="sub">across all students</div>
          </div>
          <div class="stat">
            <div class="label">${I18N.t('kpm.kpi_total_marks')}</div>
            <div class="value">${totalMarks}</div>
            <div class="sub">from ${marks.length} awards</div>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <h3>${I18N.t('kpm.chart_by_level')}</h3>
            <div style="position:relative;height:280px;">
              <canvas id="chartLevel"></canvas>
            </div>
          </div>
          <div class="card">
            <h3>${I18N.t('kpm.chart_by_category')}</h3>
            <div style="position:relative;height:280px;">
              <canvas id="chartCategory"></canvas>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>${I18N.t('kpm.chart_pajsk_trend')}</h3>
          <div style="position:relative;height:260px;">
            <canvas id="chartTrend"></canvas>
          </div>
        </div>
      `;
    }

    async function renderAsk() {
      const hasKey = AI.hasAiKey();

      return `
        <div class="header">
          <h1>${I18N.t('kpm.ask_title')}</h1>
        </div>

        <div class="card" style="background:linear-gradient(135deg,#f5f3ff 0%,#fff 100%);border:1px solid #e0daff;">
          <div class="flex-between" style="margin-bottom:0.8rem;">
            <div>
              <h3 style="margin-bottom:0.3rem;">
                <i class="fas fa-robot" style="color:var(--primary);"></i>
                ${I18N.t('kpm.ask_subtitle')}
              </h3>
            </div>
            ${!hasKey ? `
              <span class="badge badge-warning">
                <i class="fas fa-info-circle"></i> Demo mode
              </span>
            ` : `
              <span class="badge badge-success">
                <i class="fas fa-check-circle"></i> AI enabled
              </span>
            `}
          </div>

          <div style="display:flex;gap:0.6rem;flex-wrap:wrap;">
            <input
              type="text"
              id="askInput"
              placeholder="${I18N.t('kpm.ask_placeholder')}"
              style="flex:1;min-width:280px;padding-left:1rem;"
              onkeydown="if(event.key==='Enter'){askQuestion();}"
            >
            <button class="btn btn-primary" onclick="askQuestion()" id="askBtn">
              <i class="fas fa-paper-plane"></i> ${I18N.t('kpm.ask_button')}
            </button>
          </div>

          <div style="margin-top:1rem;">
            <p class="text-muted" style="font-size:0.85rem;margin-bottom:0.5rem;">
              ${I18N.t('kpm.ask_examples')}
            </p>
            <div class="flex" style="gap:0.4rem;">
              <button class="btn btn-outline btn-sm" onclick="fillAsk('${I18N.t('kpm.ask_ex1')}')">${I18N.t('kpm.ask_ex1')}</button>
              <button class="btn btn-outline btn-sm" onclick="fillAsk('${I18N.t('kpm.ask_ex2')}')">${I18N.t('kpm.ask_ex2')}</button>
              <button class="btn btn-outline btn-sm" onclick="fillAsk('${I18N.t('kpm.ask_ex3')}')">${I18N.t('kpm.ask_ex3')}</button>
              <button class="btn btn-outline btn-sm" onclick="fillAsk('${I18N.t('kpm.ask_ex4')}')">${I18N.t('kpm.ask_ex4')}</button>
            </div>
          </div>
        </div>

        <div id="askResponse"></div>
      `;
    }

    function fillAsk(text) {
      const input = document.getElementById('askInput');
      if (input) {
        input.value = text;
        input.focus();
      }
    }

    async function askQuestion() {
      const input = document.getElementById('askInput');
      const question = input?.value.trim();
      if (!question) return;

      const btn = document.getElementById('askBtn');
      const response = document.getElementById('askResponse');

      btn.disabled = true;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${I18N.t('kpm.ask_thinking')}`;
      response.innerHTML = `<div class="card" style="text-align:center;padding:2rem;">
        <div style="font-size:2rem;color:var(--primary);margin-bottom:0.8rem;"><i class="fas fa-spinner fa-spin"></i></div>
        <p class="text-muted">${I18N.t('kpm.ask_thinking')}</p>
      </div>`;

      try {
        const lang = I18N.getLanguage();
        const {
          filter,
          result,
          answer
        } = await AI.aiNaturalQuery(question, lang);
        response.innerHTML = renderAskResult(question, filter, result, answer);
      } catch (err) {
        console.error(err);
        response.innerHTML = `<div class="card" style="background:#fff5f7;border-color:#ffd5dd;">
          <p style="color:#c41e3a;margin:0;"><i class="fas fa-exclamation-triangle"></i> ${err.message || 'Query failed'}</p>
        </div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fas fa-paper-plane"></i> ${I18N.t('kpm.ask_button')}`;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function renderAskResult(question, filter, result, answer) {
      let rowsHtml = '';
      if (Array.isArray(result.rows) && result.rows.length > 0) {
        const sample = result.rows.slice(0, 10);
        const entity = filter.entity || 'competitions';
        const allowedCols = {
          competitions: ['name', 'category', 'level', 'status', 'date', 'organizerName'],
          students: ['name', 'class', 'totalPajsk'],
          reports: ['competitionName', 'organizerName', 'participants', 'totalPajskAwarded', 'status']
        };
        const cols = (allowedCols[entity] || Object.keys(sample[0])).filter(k => k in sample[0]).slice(0, 5);

        rowsHtml = `<table class="modal-table" style="margin-top:1rem;">
          <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
          <tbody>
            ${sample.map(row => `<tr>${cols.map(c => {
              const v = row[c];
              const display = typeof v === 'object' ? '—' : (v ?? '—');
              return `<td>${String(display).slice(0, 60)}</td>`;
            }).join('')}</tr>`).join('')}
          </tbody>
        </table>
        ${result.rows.length > 10 ? `<p class="text-muted" style="margin-top:0.6rem;font-size:0.85rem;">Showing 10 of ${result.rows.length} rows</p>` : ''}`;
      }

      let metricsHtml = '';
      if (result.count !== undefined) {
        metricsHtml = `<div class="stat" style="display:inline-block;padding:1rem 1.5rem;margin-top:1rem;"><div class="label">Count</div><div class="value">${result.count}</div></div>`;
      } else if (result.total !== undefined) {
        metricsHtml = `<div class="stat" style="display:inline-block;padding:1rem 1.5rem;margin-top:1rem;"><div class="label">${result.field}</div><div class="value">${result.total}</div></div>`;
      } else if (result.average !== undefined) {
        metricsHtml = `<div class="stat" style="display:inline-block;padding:1rem 1.5rem;margin-top:1rem;"><div class="label">Average ${result.field}</div><div class="value">${result.average.toFixed(1)}</div></div>`;
      }

      return `<div class="card">
        <div style="display:flex;gap:0.6rem;align-items:flex-start;margin-bottom:1rem;">
          <div style="width:36px;height:36px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fas fa-user"></i></div>
          <div style="flex:1;"><strong style="font-size:0.9rem;">You asked</strong><p style="margin:0.2rem 0 0;color:var(--text-muted);font-size:0.95rem;">${question}</p></div>
        </div>
        <div style="display:flex;gap:0.6rem;align-items:flex-start;">
          <div style="width:36px;height:36px;border-radius:50%;background:#f5f3ff;color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fas fa-robot"></i></div>
          <div style="flex:1;">
            <strong style="font-size:0.9rem;">EduMinat AI</strong>
            <div style="margin-top:0.4rem;padding:1rem 1.2rem;background:var(--primary-light);border-radius:12px;font-size:0.95rem;line-height:1.6;">${AI.markdownToHtml(answer)}</div>
            ${metricsHtml}
            ${rowsHtml}
            <details style="margin-top:1rem;">
              <summary style="cursor:pointer;font-size:0.85rem;color:var(--text-light);">${I18N.t('kpm.ask_filter')}</summary>
              <pre style="margin-top:0.5rem;background:#fafaff;padding:0.8rem;border-radius:8px;font-size:0.8rem;overflow-x:auto;">${JSON.stringify(filter, null, 2)}</pre>
            </details>
          </div>
        </div>
      </div>`;
    }

    async function renderReports() {
      const reports = await DB.Reports.all();
      const submitted = reports.filter(r => r.status === 'submitted');
      const acknowledged = reports.filter(r => r.status === 'acknowledged');
      reports.sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0));

      return `
        <div class="header"><h1>${I18N.t('kpm.reports_title')}</h1></div>

        <div class="grid-3">
          <div class="stat"><div class="label">${I18N.t('kpm.pending')}</div><div class="value">${submitted.length}</div><div class="sub">${I18N.t('kpm.pending_sub')}</div></div>
          <div class="stat"><div class="label">${I18N.t('kpm.verified')}</div><div class="value">${acknowledged.length}</div><div class="sub">${I18N.t('kpm.verified_sub')}</div></div>
          <div class="stat"><div class="label">${I18N.t('kpm.total')}</div><div class="value">${reports.length}</div><div class="sub"></div></div>
        </div>

        <div class="card">
          <h3>${I18N.t('kpm.reports')}</h3>
          ${reports.length === 0 ? emptyState(I18N.t('kpm.no_reports')) : `
            <div class="tt-toolbar">
              <div class="tt-search">
                <i class="fas fa-search"></i>
                <input type="text" id="reportsSearch" placeholder="${I18N.t('common.search_reports')}">
              </div>
              <select id="reportsStatus">
                <option value="">${I18N.t('common.all_statuses')}</option>
                <option value="${I18N.t('status.submitted')}">${I18N.t('status.submitted')}</option>
                <option value="${I18N.t('status.acknowledged')}">${I18N.t('status.acknowledged')}</option>
              </select>
            </div>

            <table id="reportsTable">
              <tr>
                <th>${I18N.t('th.competition')}</th>
                <th>${I18N.t('th.organizer')}</th>
                <th>${I18N.t('th.participants')}</th>
                <th>${I18N.t('th.total_pajsk')}</th>

    async function downloadAcknowledgementPDF(reportId) {

      await document.fonts.load('11pt "Times New Roman"');

      try {
        showToast(I18N.t('kpm.pdf_preparing'), 'spinner');

        const report = await DB.Reports.get(reportId);
        const comp = await DB.Competitions.get(report.competitionId);
        const profile = await DB.getKpmLetterhead();
        const organizer = await DB.Users.get(report.organizerEmail);

        // ---- Two logical pages ----
        const pagesHtml = [
          buildLetterPage(report, comp, profile, organizer),
          buildPajskReferencePage()
        ];

        // ---- Build a staging container (VISIBLE so html2canvas renders it) ----
        const stage = document.createElement('div');
        stage.style.cssText = `
          position: fixed;
          top: 0;
          left: 0;
          width: 794px;
          background: #ffffff;
          z-index: -1;
          pointer-events: none;
        `;
        document.body.appendChild(stage);

        await document.fonts.ready.catch(() => {});

        const {
          jsPDF
        } = window.jspdf;
        const pdf = new jsPDF({
          unit: 'mm',
          format: 'a4',
          orientation: 'portrait'
        });

        for (let i = 0; i < pagesHtml.length; i++) {
          stage.innerHTML = pagesHtml[i];
          // Give layout a tick
          await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

          const canvas = await html2canvas(stage, {
            scale: 2,
            useCORS: true,
            backgroundColor: '#ffffff',
            logging: false,
            windowWidth: 794,
            windowHeight: 1123
          });

          const imgData = canvas.toDataURL('image/jpeg', 0.95);
          const pageW = 210;
          const pageH = 297;

          // The letter has its own 20mm bottom padding, so we fit the canvas
          // to the page's inner area (297 - 20 = 277mm of usable height)
          const usableW = 210;
          const usableH = 297;

          const canvasRatio = canvas.width / canvas.height;
          const pageRatio = usableW / usableH;

          let finalW, finalH;
          if (canvasRatio > pageRatio) {
          // Wider than A4 → fit by width, leave vertical space
          finalW = usableW;
          finalH = usableW / canvasRatio;
          } else {
          // Taller than A4 → fit by height, accept scaling down
          finalH = usableH;
          finalW = usableH * canvasRatio;
          }

          const x = (pageW - finalW) / 2;
          const y = 0; // top-align — the wrapper already has bottom padding

          if (i > 0) pdf.addPage();
          pdf.addImage(imgData, 'JPEG', x, y, finalW, finalH);
        }

        const safeName = report.competitionName.replace(/[^a-z0-9]/gi, '_');
        pdf.save(`Pengiktirafan_${safeName}_${report.id}.pdf`);

        document.body.removeChild(stage);
        showToast(I18N.t('kpm.pdf_success'), 'file-pdf');
      } catch (err) {
        console.error('[PDF] Error:', err);
        showToast(I18N.t('kpm.pdf_failed'), 'exclamation-circle');
      }
    }

                <input type="text" id="ksContactMobile" value="${escapeHtml(k.contactPhoneMobile)}" style="padding-left:1rem;">
              </div>
            </div>

            <h4 style="margin:1rem 0 0.6rem;">${I18N.t('settings.section_letterhead')}</h4>
            <div class="form-group">
              <label>${I18N.t('settings.division')}</label>
              <input type="text" id="ksDivision" value="${escapeHtml(k.divisionName)}" style="padding-left:1rem;">
            </div>
            <div class="form-group">
              <label>${I18N.t('settings.ministry')}</label>
              <input type="text" id="ksMinistry" value="${escapeHtml(k.ministryName)}" style="padding-left:1rem;">
            </div>
            <div class="form-group">
              <label>${I18N.t('settings.address')}</label>
              <textarea id="ksAddress" rows="3" style="padding-left:1rem;">${escapeHtml(k.address)}</textarea>
            </div>
            <div class="grid-2">
              <div class="form-group">
                <label>${I18N.t('settings.phone')}</label>
                <input type="text" id="ksPhone" value="${escapeHtml(k.phone)}" style="padding-left:1rem;">
              </div>
              <div class="form-group">
                <label>${I18N.t('settings.fax')}</label>
                <input type="text" id="ksFax" value="${escapeHtml(k.fax)}" style="padding-left:1rem;">
              </div>
            </div>
            <div class="form-group">
              <label>${I18N.t('settings.website')}</label>
              <input type="text" id="ksWebsite" value="${escapeHtml(k.website)}" style="padding-left:1rem;">
            </div>

            <h4 style="margin:1rem 0 0.6rem;">${I18N.t('settings.section_ref')}</h4>
            <div class="grid-2">
              <div class="form-group">
                <label>${I18N.t('settings.ref_prefix')}</label>
                <input type="text" id="ksRefPrefix" value="${escapeHtml(k.refPrefix)}" style="padding-left:1rem;">
              </div>
              <div class="form-group">
                <label>${I18N.t('settings.ref_start')}</label>
                <input type="number" id="ksRefStart" value="${k.refStart || 1}" style="padding-left:1rem;">
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-outline" onclick="document.getElementById('kpmSettingsModal').remove()">
              ${I18N.t('common.cancel')}
            </button>
            <button class="btn btn-primary" id="ksSaveBtn">
              <i class="fas fa-save"></i> ${I18N.t('common.save')}
            </button>
          </div>
        </div>
      `;

      document.body.appendChild(overlay);
      overlay.addEventListener('click', (e) => {
        if (e.target.id === 'kpmSettingsModal') overlay.remove();
      });

      document.getElementById('ksSaveBtn').addEventListener('click', async () => {
        await DB.saveKpmLetterhead({
          directorName: document.getElementById('ksDirectorName').value.trim(),
          directorDesignation: document.getElementById('ksDirectorDesignation').value,
          contactName: document.getElementById('ksContactName').value.trim(),
          contactEmail: document.getElementById('ksContactEmail').value.trim(),
          contactPhoneLandline: document.getElementById('ksContactLandline').value.trim(),
          contactPhoneMobile: document.getElementById('ksContactMobile').value.trim(),
          divisionName: document.getElementById('ksDivision').value.trim(),
          ministryName: document.getElementById('ksMinistry').value.trim(),
          address: document.getElementById('ksAddress').value.trim(),
          phone: document.getElementById('ksPhone').value.trim(),
          fax: document.getElementById('ksFax').value.trim(),
          website: document.getElementById('ksWebsite').value.trim(),
          refPrefix: document.getElementById('ksRefPrefix').value.trim(),
          refStart: parseInt(document.getElementById('ksRefStart').value, 10) || 1
        });
        overlay.remove();
        showToast(I18N.t('settings.saved'), 'check-circle');
      });
    }

    function attachHandlers() {
      document.querySelectorAll('[data-approve]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = parseInt(btn.dataset.approve, 10);
          const comp = await DB.Competitions.get(id);
          comp.status = 'approved';
          await DB.Competitions.put(comp);
          showToast(I18N.t('kpm.approved_toast'), 'check-circle');
          render();
        });
      });

      document.querySelectorAll('[data-reject]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = parseInt(btn.dataset.reject, 10);
          const comp = await DB.Competitions.get(id);
          comp.status = 'rejected';
          await DB.Competitions.put(comp);
          showToast(I18N.t('kpm.rejected_toast'), 'times-circle');
          render();
        });
      });

      document.querySelectorAll('[data-ack]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = parseInt(btn.dataset.ack, 10);
          const report = await DB.Reports.get(id);
          report.status = 'acknowledged';
          report.acknowledgedAt = Date.now();
          await DB.Reports.put(report);
          showToast(I18N.t('kpm.ack_toast'), 'check-circle');
          render();
        });
      });

      document.querySelectorAll('[data-download-pdf]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const reportId = parseInt(btn.dataset.downloadPdf, 10);
          btn.disabled = true;
          const original = btn.innerHTML;
          btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${I18N.t('common.generating')}`;
          try {
            await downloadAcknowledgementPDF(reportId);
          } finally {
            btn.disabled = false;
            btn.innerHTML = original;
          }
        });
      });

      if (currentTab === 'queue' && document.getElementById('kpmQueueTable')) {
        TableTools.attach({
          tableSelector: '#kpmQueueTable',
          searchInput: '#kpmQueueSearch',
          filters: [{
            id: 'kpmQueueLevel',
            column: 2
          }],
          emptyMessage: I18N.t('kpm.no_pending')
        });
      }
      if (currentTab === 'all' && document.getElementById('allCompsTable')) {
        TableTools.attach({
          tableSelector: '#allCompsTable',
          searchInput: '#allCompsSearch',
          filters: [{
            id: 'allCompsLevel',
            column: 2
          }, {
            id: 'allCompsStatus',
            column: 3
          }],
          emptyMessage: I18N.t('kpm.no_comps')
        });
      }
      if (currentTab === 'reports' && document.getElementById('reportsTable')) {
        TableTools.attach({
          tableSelector: '#reportsTable',
          searchInput: '#reportsSearch',
          filters: [{
            id: 'reportsStatus',
            column: 4
          }],
          emptyMessage: I18N.t('kpm.no_reports')
        });
      }
      if (currentTab === 'analytics') initAnalyticsCharts();
    }

    let chartInstances = {};
    async function initAnalyticsCharts() {
      const levelCanvas = document.getElementById('chartLevel');
      const categoryCanvas = document.getElementById('chartCategory');
      const trendCanvas = document.getElementById('chartTrend');
      if (!levelCanvas || !categoryCanvas || !trendCanvas) return;

      Object.values(chartInstances).forEach(c => c && c.destroy());
      chartInstances = {};

      const comps = await DB.Competitions.all();
      const marks = await DB.Marks.all();
      const isEN = I18N.getLanguage() === 'en';
      const lang = isEN ? 'en-MY' : 'ms-MY';

      const levelOrder = ['antarabangsa', 'kebangsaan', 'negeri', 'bahagian', 'zon_daerah'];
      const levelLabels = levelOrder.map(lvl => DB.levelLabel(lvl));
      const levelCounts = levelOrder.map(lvl => comps.filter(c => c.level === lvl).length);

      chartInstances.level = new Chart(levelCanvas, {
        type: 'bar',
        data: {
          labels: levelLabels,
          datasets: [{
            label: isEN ? 'Competitions' : 'Pertandingan',
            data: levelCounts,
            backgroundColor: '#6A4CFF',
            borderRadius: 8,
            maxBarThickness: 60
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                precision: 0
              }
            }
          }
        }
      });

      const categories = [...new Set(comps.map(c => c.category).filter(Boolean))];
      const categoryCounts = categories.map(cat => comps.filter(c => c.category === cat).length);
      const palette = ['#6A4CFF', '#00D4FF', '#2ECC71', '#FF9F43', '#FF6B8B', '#9b8cff'];

      chartInstances.category = new Chart(categoryCanvas, {
        type: 'doughnut',
        data: {
          labels: categories,
          datasets: [{
            data: categoryCounts,
            backgroundColor: palette.slice(0, categories.length),
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                padding: 14,
                boxWidth: 12
              }
            }
          },
          cutout: '60%'
        }
      });

      const monthKeys = [];
      const monthLabels = [];
      const now = new Date();
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        monthKeys.push({
          y: d.getFullYear(),
          m: d.getMonth()
        });
        monthLabels.push(d.toLocaleDateString(lang, {
          month: 'short',
          year: '2-digit'
        }));
      }
      const trendData = monthKeys.map(k => marks
        .filter(mk => {
          const d = new Date(mk.awardedAt || 0);
          return d.getFullYear() === k.y && d.getMonth() === k.m;
        })
        .reduce((sum, mk) => sum + (mk.marks || 0), 0));

      chartInstances.trend = new Chart(trendCanvas, {
        type: 'line',
        data: {
          labels: monthLabels,
          datasets: [{
            label: isEN ? 'PAJSK awarded' : 'Mata PAJSK diagihkan',
            data: trendData,
            borderColor: '#6A4CFF',
            backgroundColor: 'rgba(106, 76, 255, 0.1)',
            borderWidth: 3,
            fill: true,
            tension: 0.35,
            pointRadius: 5,
            pointBackgroundColor: '#6A4CFF'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                precision: 0
              }
            }
          }
        }
      });
    }

    function emptyState(msg) {
      return `<div class="empty"><i class="fas fa-inbox"></i>${msg}</div>`;
    }

    function showToast(msg, icon = 'check-circle') {
      const tEl = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      const iconEl = tEl.querySelector('i');
      iconEl.className = icon === 'spinner' ? 'fas fa-spinner fa-spin' : `fas fa-${icon}`;
      tEl.classList.add('show');
      clearTimeout(tEl._hideTimer);
      if (icon !== 'spinner') tEl._hideTimer = setTimeout(() => tEl.classList.remove('show'), 2200);
    }

    init();
  </script>
</body>

</html>
